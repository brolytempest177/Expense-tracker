<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense — ExpenseTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-brand">
                <div class="brand-logo"><span class="logo-icon">💸</span><span class="brand-name">ExpenseTracker</span></div>
                <span class="badge-tag badge-subtle">Demo</span>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a></li>
                    <li class="nav-item"><a href="expenses.html" class="nav-link"><span class="nav-icon">💳</span><span class="nav-label">Expenses</span></a></li>
                    <li class="nav-item"><a href="add-expense.html" class="nav-link active"><span class="nav-icon">➕</span><span class="nav-label">Add Expense</span></a></li>
                    <li class="nav-item"><a href="budget.html" class="nav-link"><span class="nav-icon">🎯</span><span class="nav-label">Monthly Budget</span></a></li>
                    <li class="nav-item"><a href="reports.html" class="nav-link"><span class="nav-icon">📈</span><span class="nav-label">Analytics & Reports</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="AppStorage.logout()" class="btn-logout"><span class="nav-icon">🚪</span><span class="nav-label">Logout</span></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Add New Expense</h1>
                    <p class="page-subtitle">Record a new transaction to keep your spending organized.</p>
                </div>
                <div class="header-actions">
                    <a href="expenses.html" class="btn btn-ghost"><span>← Back to Expenses</span></a>
                </div>
            </div>

            <div class="form-container-card">
                <div class="card form-card">
                    <form id="addExpenseForm">
                        <div class="form-grid-2">
                            <div class="form-group">
                                <label for="amount">Amount (₹) <span class="required">*</span></label>
                                <div class="input-wrapper">
                                    <span class="input-icon">₹</span>
                                    <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required autofocus>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="date">Transaction Date <span class="required">*</span></label>
                                <div class="input-wrapper">
                                    <span class="input-icon">📅</span>
                                    <input type="date" id="date" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="description">Description <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <span class="input-icon">📝</span>
                                <input type="text" id="description" placeholder="e.g. Grocery shopping, Metro recharge" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="category">Category <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <span class="input-icon">🏷️</span>
                                <select id="category" class="form-select" required>
                                    <option value="" disabled selected>Select Category</option>
                                    <option value="Food">Food</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Education">Education</option>
                                    <option value="Shopping">Shopping</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Bills">Bills</option>
                                    <option value="Health">Health</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="notes">Additional Notes <span class="optional">(Optional)</span></label>
                            <textarea id="notes" rows="3" class="form-textarea" placeholder="Payment method, tags, or extra details..."></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><span>Save Expense</span></button>
                            <a href="expenses.html" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script>
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        document.getElementById('addExpenseForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const exp = {
                amount: document.getElementById('amount').value,
                date: document.getElementById('date').value,
                description: document.getElementById('description').value.trim(),
                category: document.getElementById('category').value,
                notes: document.getElementById('notes').value.trim()
            };

            AppStorage.addExpense(exp);
            window.location.href = 'expenses.html';
        });
    </script>
</body>
</html>
