<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — ExpenseTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo">
                    <span class="logo-icon">💰</span>
                    <h2 style="font-size:1.3rem">ExpenseTracker</h2>
                </div>
                <p class="auth-subtitle">Create your free account</p>
            </div>

            <div id="authAlert"></div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="name" placeholder="Alex Johnson" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="email" placeholder="alex@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="confirmPassword" placeholder="Re-enter password" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span>Create Account</span>
                    <span class="btn-arrow">→</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                document.getElementById('authAlert').innerHTML = `
                    <div class="alert alert-danger">
                        <span class="alert-icon">⚠️</span>
                        <span>Passwords do not match.</span>
                    </div>
                `;
                return;
            }

            const res = AppStorage.register(name, email, password);
            if (res.success) {
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('authAlert').innerHTML = `
                    <div class="alert alert-danger">
                        <span class="alert-icon">⚠️</span>
                        <span>${res.message}</span>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
