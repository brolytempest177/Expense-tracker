<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ExpenseTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo">
                    <span class="logo-icon">⚡</span>
                    <span class="brand-name">ExpenseTracker</span>
                </div>
                <h2>Welcome back</h2>
                <p class="auth-subtitle">Sign in to your account</p>
            </div>

            <div id="authAlert"></div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="email" placeholder="you@example.com" required autofocus value="alex@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="password" placeholder="••••••••" required value="password123">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.75rem">
                    <span>Sign in</span>
                </button>
            </form>

            <div style="text-align:center; margin-top:1.25rem; padding-top:1.25rem; border-top:1px solid var(--border-color);">
                <button onclick="AppStorage.guestLogin(); window.location.href='dashboard.html';" style="width:100%; padding:0.65rem 1rem; font-size:0.88rem; font-weight:600; font-family:inherit; border-radius:4px; border:1px solid #eab308; background:transparent; color:#eab308; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:0.5rem;">
                    👤 Continue as Guest
                </button>
            </div>

            <div class="auth-footer">
                <p>New here? <a href="register.html" class="auth-link">Create an account</a></p>
                <p style="margin-top: 0.75rem;">
                    <a href="#" onclick="AppStorage.clearAllData(); alert('All data cleared!'); location.reload();" style="font-size: 0.72rem; color: var(--text-subtle); text-decoration: underline;">
                        Reset all data
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const res = AppStorage.login(email, password);
            if (res.success) {
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('authAlert').innerHTML = `
                    <div class="alert alert-danger">
                        <span>${res.message}</span>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
