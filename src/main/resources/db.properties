# MySQL Database Configuration (XAMPP)
# XAMPP default: root user, no password, port 3306

db.url=jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8
db.user=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
hikari.maximumPoolSize=10
hikari.minimumIdle=2
hikari.idleTimeout=30000
hikari.connectionTimeout=10000
hikari.maxLifetime=1800000